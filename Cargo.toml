[package]
name = "scwoll"
version = "0.1.0"
edition = "2021"
description = "Scwoll — YouTube-style native media player in Rust (egui + mpv), no browser"

[[bin]]
name = "scwoll"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "accesskit", "wayland", "x11"] }
egui = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.15"
ureq = { version = "2", default-features = false, features = ["tls"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
open = "5"
